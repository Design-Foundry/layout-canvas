<app-editor-toolbar
  class="toolbar"
  [name]="name()"
  [(tool)]="tool"
  (rename)="rename($event)"
/>

<aside class="layers side">
  <lucent-tab-list class="side-tabs" [activeTab]="sideTab()" (tabChange)="sideTab.set($any($event))">
    <lucent-tab label="Layers" value="layers" />
    <lucent-tab label="Tokens" value="tokens" />
  </lucent-tab-list>
  @if (sideTab() === 'layers') {
    <app-layers-panel
      class="side-body"
      [layers]="layers()"
      [selectedIds]="selectedIds()"
      (activate)="select($event)"
      (rename)="setProps($event.id, { name: $event.name })"
      (visibility)="setProps($event.id, { visible: $event.visible })"
      (lock)="setProps($event.id, { locked: $event.locked })"
    />
  } @else {
    <app-tokens-panel
      class="side-body"
      [tokens]="tokens()"
      [modes]="modes()"
      [activeMode]="activeMode()"
      [selectedId]="selectedTokenId()"
      (activate)="selectedTokenId.set($event)"
      (addToken)="addToken($event)"
      (modeChange)="setActiveMode($event)"
      (addMode)="addMode()"
      (renameMode)="renameMode($event)"
      (deleteMode)="core()?.deleteMode($event)"
    />
  }
</aside>

<main class="stage">
  <canvas id="canvas"></canvas>
  <div class="labels">
    @for (label of frameLabels(); track label.id) {
      @if (label.w > 24) {
        <button
          type="button"
          class="frame-label typography-caption"
          [class.selected]="selectedIds().has(label.id)"
          [style.left.px]="label.x"
          [style.top.px]="label.y"
          [style.max-width.px]="label.w"
          (click)="select(label.id)"
        >
          {{ label.name }}
        </button>
      }
    }
  </div>
  @if (document.error()) {
    <div class="missing">
      <span class="typography-body-md">This document doesn't exist.</span>
      <lucent-button variant="secondary" size="sm" routerLink="/">Back to documents</lucent-button>
    </div>
  }
</main>

@if (selectedToken(); as token) {
  <app-token-inspector
    class="inspector"
    [token]="token"
    [tokens]="tokens()"
    [modes]="modes()"
    [colorFromHex]="colorFromHex"
    [replace]="replaceToken"
    (remove)="deleteToken($event)"
  />
} @else {
  <app-inspector-panel
    class="inspector"
    [node]="selectedNode()"
    [tokens]="tokens()"
    [colorFromHex]="colorFromHex"
    [colorToHex]="colorToHex"
    (edit)="setSelectedProps($event)"
    (previewEdit)="previewSelectedProps($event)"
    (commitPreview)="commitPreview()"
    (cancelPreview)="core()?.cancelPreview()"
  />
}

<footer class="status typography-caption">{{ status() }}</footer>
