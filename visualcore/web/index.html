<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>visualcore</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1f22; color: #ddd; font: 13px system-ui; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    import createVisualCore from './visualcore.js';

    const core = await createVisualCore({ canvas: document.getElementById('canvas') });

    core.attach('#canvas');
    core.addRandomShapes(10000, 1);
    setInterval(() => {
      const s = core.frameStats();
      document.title = `${s.frameMs.toFixed(1)} ms, cpu ${s.cpuMs.toFixed(2)} ms, ${s.visible}/${s.total}`;
    }, 500);

    window.core = core; // poke at it from DevTools
  </script>
</body>
</html>
